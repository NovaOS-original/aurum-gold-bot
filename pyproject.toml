[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-gold-bot"
version = "0.1.0"
description = "Demo-first XAU/USD strategy research and backtesting"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
